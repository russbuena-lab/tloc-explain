[package]
name = "tloc-explain"
version = "0.1.0"
edition = "2021"
authors = ["Russ Buena <russbuena@gmail.com>"]
description = "Standalone Cisco Catalyst SD-WAN Router TLOC, OMP Route & Transport Preferencing Explainer CLI"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
