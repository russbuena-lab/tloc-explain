[package]
name = "tloc-explain"
version = "0.1.0"
edition = "2021"
authors = ["Russ Buena <russbuena@gmail.com>"]
description = "Standalone Cisco Catalyst SD-WAN Router TLOC, OMP Route & Transport Preferencing Explainer CLI"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
